<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Only adding this because I don't have your CSS file */
        :root {
            --grey-11: #1C1C1C;
            --grey-15: #262626;
            --primary-color-60: #CAFF33;
            --green-65: #b5e62e;
        }
    </style>
</head>
<body class="bg-black p-4">

    <!-- 1. The Controller: A hidden checkbox that tracks if menu is open/closed -->
    <input type="checkbox" id="mobile-menu-toggle" class="peer hidden">

    <!-- 2. The Navbar -->
    <nav class="max-w-[1596px] mx-auto bg-[--grey-11] border border-[--grey-15] rounded-[100px] py-5 px-6 md:px-8 flex items-center justify-between sticky top-4 z-50">
        
        <!-- Logo Section -->
        <div>
            <div class="flex items-center space-x-4">
                <img src="assets/Logo(2).png" alt="Bank Logo" class="h-8"> <!-- Added h-8 just in case -->
            </div>
        </div>

        <!-- Desktop Navigation Links (Hidden on Mobile) -->
        <div class="hidden md:flex gap-2 bg-[--grey-11] border border-[--grey-15] rounded-full p-1">
            <a href="#" class="text-white rounded-full text-sm font-medium bg-[--grey-15] px-6 py-2">Home</a>
            <a href="#" class="text-white rounded-full text-sm font-medium hover:bg-[--grey-15] px-6 py-2 transition">Careers</a>
            <a href="#" class="text-white rounded-full text-sm font-medium hover:bg-[--grey-15] px-6 py-2 transition">About</a>
            <a href="#" class="text-white rounded-full text-sm font-medium hover:bg-[--grey-15] px-6 py-2 transition">Security</a>
        </div>

        <!-- Desktop Login Buttons (Hidden on Mobile) -->
        <div class="hidden md:flex gap-2 items-center">
            <a href="#" class="text-white rounded-full text-sm font-medium hover:bg-[--grey-15] px-6 py-2 transition">Sign Up</a>
            <button class="bg-[--primary-color-60] text-black px-6 py-2 rounded-full hover:bg-[--green-65] font-medium transition">Login</button>
        </div>

        <!-- Hamburger Icon (Visible ONLY on Mobile) -->
        <!-- This label triggers the checkbox above -->
        <label for="mobile-menu-toggle" class="md:hidden text-white cursor-pointer p-2">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </label>
    </nav>

    <!-- 3. The Mobile Menu Overlay (Dark background) -->
    <label for="mobile-menu-toggle" class="fixed inset-0 bg-black/50 z-40 hidden peer-checked:block backdrop-blur-sm transition-opacity"></label>

    <!-- 4. The Mobile Sidebar (Slides in from Right) -->
    <div class="fixed top-0 right-0 h-full w-64 bg-[--grey-11] z-50 transform translate-x-full peer-checked:translate-x-0 transition-transform duration-300 ease-in-out border-l border-[--grey-15] shadow-2xl">
        
        <!-- Close Button Area -->
        <div class="flex justify-end p-6">
            <label for="mobile-menu-toggle" class="text-white cursor-pointer hover:text-[--primary-color-60]">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </label>
        </div>

        <!-- Mobile Links Stack -->
        <div class="flex flex-col px-6 space-y-4">
            <a href="#" class="text-white text-lg font-medium hover:text-[--primary-color-60]">Home</a>
            <a href="#" class="text-gray-400 text-lg font-medium hover:text-white">Careers</a>
            <a href="#" class="text-gray-400 text-lg font-medium hover:text-white">About</a>
            <a href="#" class="text-gray-400 text-lg font-medium hover:text-white">Security</a>
            
            <div class="h-px bg-[--grey-15] my-4"></div> <!-- Divider Line -->
            
            <a href="#" class="text-white text-lg font-medium hover:text-[--primary-color-60]">Sign Up</a>
            <button class="w-full bg-[--primary-color-60] text-black px-6 py-3 rounded-full font-bold mt-2">Login</button>
        </div>
    </div>

</body>
</html>
